# Render Blueprint — Through The Veil (ebook platform)
services:
  - type: web
    name: theveil
    runtime: node
    region: ohio
    plan: starter
    branch: main
    repo: https://github.com/cryptocreeper94-sudo/theveil
    buildCommand: echo "No build needed"
    startCommand: node server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
