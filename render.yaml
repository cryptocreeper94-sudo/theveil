# Render Blueprint — Through The Veil (ebook platform)
services:
  - type: web
    name: theveil
    runtime: node
    region: ohio
    plan: starter
    branch: main
    repo: https://github.com/cryptocreeper94-sudo/theveil
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false